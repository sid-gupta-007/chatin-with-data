<title>Chat with Your Data</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --primary: #3B82F6;
  --secondary: #10B981;
  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --text: #1E293B;
  --text-dim: #64748B;
  --border: #E2E8F0;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F172A;
    --surface: #1E293B;
    --text: #E2E8F0;
    --text-dim: #94A3B8;
    --border: #334155;
  }
}

:root[data-theme="dark"] {
  --bg: #0F172A;
  --surface: #1E293B;
  --text: #E2E8F0;
  --text-dim: #94A3B8;
  --border: #334155;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr;
}

header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 1.5rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  font-weight: 700;
  font-size: 1.25rem;
}

.logo-icon {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.25rem;
}

.main {
  display: grid;
  grid-template-columns: 350px 1fr;
  gap: 0;
}

.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 1.5rem;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.upload-section h3 {
  font-size: 0.875rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-dim);
  margin-bottom: 0.75rem;
}

.upload-box {
  border: 2px dashed var(--border);
  border-radius: 12px;
  padding: 1.5rem;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}

.upload-box:hover {
  border-color: var(--primary);
  background: rgba(59, 130, 246, 0.05);
}

.upload-box input {
  display: none;
}

.upload-icon {
  font-size: 2rem;
  margin-bottom: 0.5rem;
}

.upload-text {
  font-size: 0.875rem;
  color: var(--text-dim);
}

.data-preview {
  flex: 1;
}

.data-preview h3 {
  font-size: 0.875rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-dim);
  margin-bottom: 0.75rem;
}

.data-table {
  font-size: 0.75rem;
  border-collapse: collapse;
  width: 100%;
}

.data-table th {
  background: var(--bg);
  padding: 0.5rem;
  text-align: left;
  font-weight: 600;
  border-bottom: 1px solid var(--border);
  color: var(--primary);
}

.data-table td {
  padding: 0.5rem;
  border-bottom: 1px solid var(--border);
}

.data-table tr:hover {
  background: var(--bg);
}

.chat-area {
  display: grid;
  grid-template-rows: 1fr auto;
  background: var(--bg);
}

.messages {
  overflow-y: auto;
  padding: 2rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.message {
  display: flex;
  gap: 0.75rem;
  animation: slideIn 0.3s ease-out;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.message.user {
  justify-content: flex-end;
}

.message-content {
  max-width: 70%;
  padding: 0.875rem 1.25rem;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
}

.message.user .message-content {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

.message.assistant .message-icon {
  font-size: 1.5rem;
}

.message.user .message-icon {
  font-size: 1.5rem;
}

.message-result {
  margin-top: 0.75rem;
  padding: 1rem;
  background: var(--surface);
  border-radius: 8px;
  border: 1px solid var(--border);
  font-size: 0.875rem;
}

.result-title {
  font-weight: 600;
  color: var(--primary);
  margin-bottom: 0.5rem;
  font-size: 0.8125rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.result-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.8125rem;
}

.result-table th {
  background: var(--bg);
  padding: 0.5rem;
  text-align: left;
  font-weight: 600;
  border-bottom: 1px solid var(--border);
}

.result-table td {
  padding: 0.5rem;
  border-bottom: 1px solid var(--border);
}

.chart-container {
  margin-top: 1rem;
  padding: 1rem;
  background: var(--bg);
  border-radius: 8px;
}

.bar-chart {
  display: flex;
  align-items: flex-end;
  gap: 0.5rem;
  height: 150px;
}

.bar {
  flex: 1;
  background: linear-gradient(to top, var(--primary), #60A5FA);
  border-radius: 4px 4px 0 0;
  position: relative;
  min-height: 10px;
}

.bar-label {
  position: absolute;
  bottom: -24px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 0.6875rem;
  color: var(--text-dim);
}

.input-area {
  padding: 1.5rem;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 0.75rem;
}

.input-wrapper {
  flex: 1;
  display: flex;
  gap: 0.5rem;
}

input[type="text"] {
  flex: 1;
  padding: 0.875rem 1.25rem;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
  color: var(--text);
  font-size: 0.9375rem;
  font-family: inherit;
  transition: border-color 0.2s;
}

input[type="text"]:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}

button {
  padding: 0.875rem 1.5rem;
  background: linear-gradient(135deg, var(--primary), #2563EB);
  color: white;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  font-size: 0.9375rem;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
}

button:active {
  transform: translateY(0);
}

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-dim);
  text-align: center;
}

.empty-icon {
  font-size: 4rem;
  margin-bottom: 1rem;
  opacity: 0.5;
}

.loading {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  color: var(--primary);
}

.spinner {
  width: 16px;
  height: 16px;
  border: 2px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@media (max-width: 768px) {
  .main {
    grid-template-columns: 1fr;
  }

  .sidebar {
    display: none;
  }

  .message-content {
    max-width: 90%;
  }
}
</style>

<div class="container">
  <header>
    <div class="logo">
      <div class="logo-icon">📊</div>
      <div>Chat with Your Data</div>
    </div>
    <div style="font-size: 0.875rem; color: var(--text-dim);">AI-powered data intelligence</div>
  </header>

  <div class="main">
    <div class="sidebar">
      <div class="upload-section">
        <h3>📁 Upload Data</h3>
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
          <div class="upload-icon">📤</div>
          <div class="upload-text">Drag or click to upload Excel file</div>
          <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
        </div>
      </div>

      <div class="data-preview">
        <h3>👀 Preview</h3>
        <table class="data-table" id="previewTable" style="display: none;">
          <thead id="previewHead"></thead>
          <tbody id="previewBody"></tbody>
        </table>
        <div id="noDataMsg" style="color: var(--text-dim); font-size: 0.875rem;">
          No data loaded yet
        </div>
      </div>
    </div>

    <div class="chat-area">
      <div class="messages" id="messages">
        <div class="empty-state">
          <div class="empty-icon">💬</div>
          <p>Upload an Excel file and ask questions about your data</p>
          <p style="font-size: 0.875rem; margin-top: 0.5rem;">Examples: "Show top 5 sales", "Average by region", "Total revenue"</p>
        </div>
      </div>

      <div class="input-area">
        <div class="input-wrapper">
          <input type="text" id="queryInput" placeholder="Ask me anything about your data..." disabled>
        </div>
        <button id="sendBtn" onclick="sendQuery()" disabled>Send</button>
      </div>

      <div style="padding: 1rem; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 0.5rem; flex-wrap: wrap;">
        <button onclick="quickQuery('Top 5 by Salary')" style="padding: 0.5rem 1rem; font-size: 0.8125rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; color: var(--text-dim);">Top 5 Salary</button>
        <button onclick="quickQuery('Show all')" style="padding: 0.5rem 1rem; font-size: 0.8125rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; color: var(--text-dim);">All Data</button>
        <button onclick="quickQuery('Count by Department')" style="padding: 0.5rem 1rem; font-size: 0.8125rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; color: var(--text-dim);">Dept Count</button>
        <button onclick="quickQuery('Average Salary')" style="padding: 0.5rem 1rem; font-size: 0.8125rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; color: var(--text-dim);">Avg Salary</button>
      </div>
    </div>
  </div>
</div>

<script>
let currentData = [];
let currentColumns = [];

// Sample data for demo
const sampleData = [
  { Name: "Alice", Department: "Sales", Salary: 85000, Region: "East" },
  { Name: "Bob", Department: "Engineering", Salary: 120000, Region: "West" },
  { Name: "Carol", Department: "Sales", Salary: 95000, Region: "East" },
  { Name: "David", Department: "Marketing", Salary: 75000, Region: "North" },
  { Name: "Eve", Department: "Engineering", Salary: 130000, Region: "West" },
  { Name: "Frank", Department: "Sales", Salary: 90000, Region: "South" },
  { Name: "Grace", Department: "Marketing", Salary: 78000, Region: "North" },
  { Name: "Henry", Department: "Engineering", Salary: 125000, Region: "East" },
];

// Initialize with sample data
loadData(sampleData);

function loadData(data) {
  currentData = data;
  currentColumns = Object.keys(data[0] || {});
  updatePreview();
  enableChat();
  addMessage("assistant", "Data loaded! " + data.length + " rows, " + currentColumns.length + " columns. Ask me anything!");
}

function updatePreview() {
  if (currentData.length === 0) return;

  const table = document.getElementById("previewTable");
  const head = document.getElementById("previewHead");
  const body = document.getElementById("previewBody");

  head.innerHTML = currentColumns.map(c => `<th>${c}</th>`).join("");
  body.innerHTML = currentData.slice(0, 5).map(row =>
    `<tr>${currentColumns.map(c => `<td>${row[c]}</td>`).join("")}</tr>`
  ).join("");

  table.style.display = "table";
  document.getElementById("noDataMsg").style.display = "none";
}

function enableChat() {
  document.getElementById("queryInput").disabled = false;
  document.getElementById("sendBtn").disabled = false;
}

function sendQuery() {
  const query = document.getElementById("queryInput").value.trim();
  if (!query || currentData.length === 0) return;

  addMessage("user", query);
  document.getElementById("queryInput").value = "";

  setTimeout(() => processQuery(query), 300);
}

function processQuery(query) {
  const q = query.toLowerCase();
  let result = null;

  // Direct column lookup (e.g., "alice's dept" -> find Name=Alice, return Department)
  const colLookup = q.match(/(.+?)(?:'s|')?(\w+)?$/);
  if (colLookup) {
    const searchTerm = colLookup[1].replace(/['\s]/g, "").toLowerCase();
    const targetCol = colLookup[2] ? findColumn(colLookup[2]) : null;

    for (let row of currentData) {
      for (let col of currentColumns) {
        if (String(row[col]).toLowerCase().includes(searchTerm)) {
          if (targetCol) {
            addMessage("assistant", `📊 ${col} <strong>${row[col]}</strong> has ${targetCol}: <strong>${row[targetCol]}</strong>`);
            return;
          } else {
            displayResults(`Found: ${row[currentColumns[0]]}`, [row], currentColumns);
            return;
          }
        }
      }
    }
  }

  // Top N by column
  const topMatch = q.match(/top (\d+) (?:by |highest |largest |in )(.+)/i);
  if (topMatch) {
    const n = parseInt(topMatch[1]);
    const col = findColumn(topMatch[2]);
    if (col && typeof currentData[0][col] === "number") {
      result = currentData.sort((a, b) => b[col] - a[col]).slice(0, n);
      displayResults(`Top ${n} by ${col}`, result, [findDisplayCol(), col]);
      return;
    }
  }

  // Filter by value (e.g., "salespeople", "engineering team", "west region")
  for (let col of currentColumns) {
    const colStr = col.toLowerCase();
    if (q.includes(colStr)) {
      for (let row of currentData) {
        const searchWord = q.replace(new RegExp(colStr, 'i'), '').trim();
        if (String(row[col]).toLowerCase().includes(searchWord.toLowerCase())) {
          const filtered = currentData.filter(r => r[col] === row[col]);
          displayResults(`${col}: ${row[col]}`, filtered, currentColumns.slice(0, 3));
          return;
        }
      }
    }
  }

  // Average
  if (q.includes("average") || q.includes("avg") || q.includes("mean")) {
    const numCols = currentColumns.filter(c => typeof currentData[0][c] === "number");
    if (numCols.length > 0) {
      const col = numCols[0];
      const avg = (currentData.reduce((s, r) => s + r[col], 0) / currentData.length).toFixed(2);
      addMessage("assistant", `📊 Average ${col}: <strong>$${avg}</strong>`);
      return;
    }
  }

  // Sum/Total
  if (q.includes("total") || q.includes("sum")) {
    const numCols = currentColumns.filter(c => typeof currentData[0][c] === "number");
    if (numCols.length > 0) {
      const col = numCols[0];
      const total = currentData.reduce((s, r) => s + r[col], 0);
      addMessage("assistant", `📊 Total ${col}: <strong>$${total.toLocaleString()}</strong>`);
      return;
    }
  }

  // Group by
  const groupMatch = q.match(/(?:by|group by|breakdown by|count by|employees by) (.+)/i);
  if (groupMatch) {
    const col = findColumn(groupMatch[1]);
    if (col) {
      const grouped = {};
      currentData.forEach(row => {
        const key = row[col];
        grouped[key] = (grouped[key] || 0) + 1;
      });
      displayGrouped(col, grouped);
      return;
    }
  }

  // Show all
  if (q.includes("show") || q.includes("list") || q.includes("all")) {
    displayResults("All Data", currentData, currentColumns.slice(0, 3));
    return;
  }

  // Default
  addMessage("assistant", "I can help! Try asking:<br>• Show top 5 by Salary<br>• What's alice's department?<br>• Average Salary<br>• Total employees by Department<br>• Show all data");
}

function findColumn(search) {
  search = search.toLowerCase().trim();
  return currentColumns.find(c => c.toLowerCase().includes(search.split(/\s+/)[0])) || currentColumns[0];
}

function findDisplayCol() {
  return currentColumns.find(c => typeof currentData[0][c] === "string") || currentColumns[0];
}

function displayResults(title, data, cols = null) {
  if (!cols) cols = currentColumns;

  const html = `
    <div class="message-result">
      <div class="result-title">${title}</div>
      <table class="result-table">
        <thead><tr>${cols.map(c => `<th>${c}</th>`).join("")}</tr></thead>
        <tbody>${data.slice(0, 10).map(row =>
          `<tr>${cols.map(c => `<td>${row[c]}</td>`).join("")}</tr>`
        ).join("")}</tbody>
      </table>
    </div>
  `;

  addMessage("assistant", html, true);
}

function displayGrouped(col, grouped) {
  const entries = Object.entries(grouped).sort((a, b) => b[1] - a[1]);
  const html = `
    <div class="message-result">
      <div class="result-title">Count by ${col}</div>
      <table class="result-table">
        <thead><tr><th>${col}</th><th>Count</th></tr></thead>
        <tbody>${entries.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("")}</tbody>
      </table>
      <div class="chart-container">
        <div class="bar-chart">
          ${entries.slice(0, 5).map(([k, v]) => {
            const maxVal = Math.max(...entries.map(e => e[1]));
            const height = (v / maxVal) * 100;
            return `<div class="bar" style="height: ${height}%"><span class="bar-label">${k}</span></div>`;
          }).join("")}
        </div>
      </div>
    </div>
  `;

  addMessage("assistant", html, true);
}

function addMessage(role, content, isHTML = false) {
  const messagesDiv = document.getElementById("messages");

  // Clear empty state
  if (messagesDiv.querySelector(".empty-state")) {
    messagesDiv.innerHTML = "";
  }

  const msgDiv = document.createElement("div");
  msgDiv.className = `message ${role}`;

  const iconSpan = document.createElement("span");
  iconSpan.className = "message-icon";
  iconSpan.textContent = role === "user" ? "👤" : "🤖";

  const contentDiv = document.createElement("div");
  contentDiv.className = "message-content";

  if (isHTML) {
    contentDiv.innerHTML = content;
  } else {
    contentDiv.textContent = content;
  }

  if (role === "user") {
    msgDiv.appendChild(contentDiv);
    msgDiv.appendChild(iconSpan);
  } else {
    msgDiv.appendChild(iconSpan);
    msgDiv.appendChild(contentDiv);
  }

  messagesDiv.appendChild(msgDiv);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

// File upload
document.getElementById("fileInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (event) => {
    try {
      if (file.name.endsWith(".csv")) {
        const text = event.target.result;
        const rows = text.trim().split("\n");
        const headers = rows[0].split(",");
        const data = rows.slice(1).map(row => {
          const values = row.split(",");
          const obj = {};
          headers.forEach((h, i) => obj[h.trim()] = values[i]?.trim() || "");
          return obj;
        });
        loadData(data);
      } else {
        loadData(sampleData);
        addMessage("assistant", "Demo with sample data. (Full Excel parsing requires a backend library)");
      }
    } catch (err) {
      addMessage("assistant", "Error loading file. Using sample data instead.");
      loadData(sampleData);
    }
  };
  reader.readAsText(file);
});

document.getElementById("queryInput").addEventListener("keypress", (e) => {
  if (e.key === "Enter") sendQuery();
});

function quickQuery(query) {
  document.getElementById("queryInput").value = query;
  sendQuery();
}
</script>
