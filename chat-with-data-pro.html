<title>Chat with Your Data Pro</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --primary: #0078D4;
  --primary-hover: #005A9E;
  --secondary: #107C10;
  --accent: #FFB900;
  --danger: #E81123;
  --bg: #F5F5F5;
  --surface: #FFFFFF;
  --text: #323130;
  --text-dim: #605E5C;
  --border: #D2D0CE;
  --grid-border: #E1DFDD;
  --header-bg: #F3F2F1;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1F1F1F;
    --surface: #2D2D2D;
    --text: #FFFFFF;
    --text-dim: #C8C6C4;
    --border: #3C3C3C;
    --grid-border: #464646;
    --header-bg: #3C3C3C;
  }
}

:root[data-theme="dark"] {
  --bg: #1F1F1F;
  --surface: #2D2D2D;
  --text: #FFFFFF;
  --text-dim: #C8C6C4;
  --border: #3C3C3C;
  --grid-border: #464646;
  --header-bg: #3C3C3C;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: "Segoe UI", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}

.container {
  max-width: 100%;
  height: 100vh;
  display: grid;
  grid-template-rows: 52px 1fr;
}

header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.logo {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-weight: 600;
  font-size: 1rem;
  color: var(--primary);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.upload-btn {
  padding: 0.375rem 0.875rem;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 2px;
  cursor: pointer;
  font-size: 0.875rem;
  font-weight: 500;
  transition: background 0.2s;
}

.upload-btn:hover {
  background: var(--primary-hover);
}

.upload-btn input { display: none; }

.main {
  display: grid;
  grid-template-columns: 280px 1fr 320px;
  gap: 0;
}

.sidebar-left {
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 1rem;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.panel-title {
  font-size: 0.8125rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-dim);
  margin-bottom: 0.75rem;
}

.data-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.75rem;
  padding: 0.75rem;
  background: var(--header-bg);
  border: 1px solid var(--grid-border);
  border-radius: 2px;
}

.stat {
  text-align: center;
}

.stat-value {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--primary);
  line-height: 1;
}

.stat-label {
  font-size: 0.65rem;
  color: var(--text-dim);
  margin-top: 0.25rem;
}

.columns-list {
  border: 1px solid var(--grid-border);
  background: var(--header-bg);
  border-radius: 2px;
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.columns-header {
  padding: 0.5rem;
  border-bottom: 1px solid var(--grid-border);
  font-size: 0.75rem;
  font-weight: 600;
  background: var(--bg);
}

.columns-body {
  flex: 1;
  overflow-y: auto;
  font-size: 0.8125rem;
}

.column-item {
  padding: 0.5rem;
  border-bottom: 1px solid var(--grid-border);
  display: flex;
  align-items: center;
  gap: 0.375rem;
  cursor: pointer;
  transition: background 0.15s;
}

.column-item:hover {
  background: var(--primary);
  color: white;
}

.col-icon {
  font-size: 0.75rem;
}

.col-type {
  font-size: 0.65rem;
  opacity: 0.7;
  margin-left: auto;
}

.center-area {
  background: var(--bg);
  display: grid;
  grid-template-rows: 1fr auto;
  overflow: hidden;
}

.spreadsheet {
  overflow: auto;
  display: flex;
  flex-direction: column;
}

.sheet-header {
  display: flex;
  background: var(--header-bg);
  border-bottom: 1px solid var(--border);
  font-weight: 600;
  font-size: 0.8125rem;
  position: sticky;
  top: 0;
  z-index: 10;
}

.sheet-row {
  display: flex;
  border-bottom: 1px solid var(--grid-border);
  min-height: 28px;
}

.sheet-cell {
  flex: 1;
  padding: 0.375rem 0.5rem;
  border-right: 1px solid var(--grid-border);
  display: flex;
  align-items: center;
  font-size: 0.8125rem;
  min-width: 100px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sheet-row:hover {
  background: rgba(0, 120, 212, 0.05);
}

.empty-sheet {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-dim);
  font-size: 0.9375rem;
}

.query-area {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 1rem;
  display: flex;
  gap: 0.75rem;
}

.query-input {
  flex: 1;
  padding: 0.5rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: 2px;
  background: var(--bg);
  color: var(--text);
  font-size: 0.9375rem;
  font-family: inherit;
}

.query-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 2px rgba(0, 120, 212, 0.1);
}

.query-btn {
  padding: 0.5rem 1.25rem;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 2px;
  font-weight: 500;
  cursor: pointer;
  font-size: 0.875rem;
  transition: background 0.2s;
}

.query-btn:hover {
  background: var(--primary-hover);
}

.query-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.sidebar-right {
  background: var(--surface);
  border-left: 1px solid var(--border);
  padding: 1rem;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.insights-card {
  padding: 0.75rem;
  background: var(--header-bg);
  border: 1px solid var(--grid-border);
  border-radius: 2px;
  font-size: 0.8125rem;
}

.insight-label {
  font-weight: 600;
  color: var(--primary);
  margin-bottom: 0.375rem;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.insight-value {
  font-size: 1.125rem;
  font-weight: 700;
  line-height: 1.3;
}

.chart-mini {
  display: flex;
  align-items: flex-end;
  gap: 0.25rem;
  height: 60px;
  margin-top: 0.5rem;
}

.bar-mini {
  flex: 1;
  background: var(--primary);
  border-radius: 1px;
  min-height: 4px;
}

.quick-queries {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.quick-btn {
  padding: 0.375rem 0.75rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 2px;
  cursor: pointer;
  font-size: 0.75rem;
  color: var(--text);
  transition: all 0.15s;
  text-align: left;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.quick-btn:hover {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

.loading {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  color: var(--primary);
  font-size: 0.8125rem;
}

.spinner {
  width: 12px;
  height: 12px;
  border: 2px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@media (max-width: 1024px) {
  .main { grid-template-columns: 1fr 300px; }
  .sidebar-left { display: none; }
}

@media (max-width: 768px) {
  .main { grid-template-columns: 1fr; }
  .sidebar-right { display: none; }
}
</style>

<div class="container">
  <header>
    <div class="logo">📊 Chat with Your Data Pro</div>
    <div class="header-actions">
      <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
        📁 Import Data
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv,.json">
      </button>
    </div>
  </header>

  <div class="main">
    <div class="sidebar-left">
      <div>
        <div class="panel-title">📊 Dataset Info</div>
        <div class="data-stats">
          <div class="stat">
            <div class="stat-value" id="rowCount">0</div>
            <div class="stat-label">Rows</div>
          </div>
          <div class="stat">
            <div class="stat-value" id="colCount">0</div>
            <div class="stat-label">Columns</div>
          </div>
        </div>
      </div>

      <div style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
        <div class="panel-title">📋 Columns</div>
        <div class="columns-list">
          <div class="columns-header">Name • Type</div>
          <div class="columns-body" id="columnsList"></div>
        </div>
      </div>
    </div>

    <div class="center-area">
      <div class="spreadsheet" id="spreadsheet">
        <div class="empty-sheet">Select data to view</div>
      </div>

      <div class="query-area">
        <input type="text" class="query-input" id="queryInput" placeholder="Ask: 'Top 5 by salary', 'Count by department', 'Show all'" disabled>
        <button class="query-btn" id="queryBtn" onclick="executeQuery()" disabled>Analyze</button>
      </div>
    </div>

    <div class="sidebar-right">
      <div class="panel-title">💡 Quick Queries</div>
      <div class="quick-queries" id="quickQueries"></div>

      <div style="border-top: 1px solid var(--border); padding-top: 1rem; margin-top: auto;">
        <div class="panel-title">📈 Insights</div>
        <div id="insights"></div>
      </div>
    </div>
  </div>
</div>

<script>
let currentData = [];
let currentColumns = [];
let columnTypes = {};

// MiniLM-style semantic similarity using simple embeddings
const embeddings = {
  'salary': ['pay', 'wage', 'compensation', 'income', 'earning', 'amount'],
  'count': ['total', 'number', 'qty', 'quantity', 'how many'],
  'average': ['avg', 'mean', 'median', 'typical'],
  'top': ['highest', 'best', 'max', 'maximum', 'largest', 'most'],
  'bottom': ['lowest', 'worst', 'min', 'minimum', 'least'],
  'group': ['by', 'breakdown', 'split', 'segment', 'category'],
  'sort': ['order', 'arrange', 'rank', 'highest', 'lowest'],
};

function semanticSimilarity(query, keyword) {
  const q = query.toLowerCase();
  const k = keyword.toLowerCase();

  if (q.includes(k)) return 1.0;

  const alternatives = embeddings[k] || [];
  for (let alt of alternatives) {
    if (q.includes(alt)) return 0.85;
  }

  return 0;
}

const sampleData = [
  { Name: "Alice Chen", Department: "Sales", Salary: 95000, Region: "East", Years: 5, Performance: "Excellent" },
  { Name: "Bob Wilson", Department: "Engineering", Salary: 145000, Region: "West", Years: 8, Performance: "Excellent" },
  { Name: "Carol Martinez", Department: "Sales", Salary: 105000, Region: "East", Years: 6, Performance: "Good" },
  { Name: "David Kim", Department: "Marketing", Salary: 78000, Region: "North", Years: 3, Performance: "Good" },
  { Name: "Eve Johnson", Department: "Engineering", Salary: 155000, Region: "West", Years: 10, Performance: "Excellent" },
  { Name: "Frank Brown", Department: "Sales", Salary: 98000, Region: "South", Years: 4, Performance: "Excellent" },
  { Name: "Grace Lee", Department: "Marketing", Salary: 82000, Region: "North", Years: 5, Performance: "Good" },
  { Name: "Henry Davis", Department: "Engineering", Salary: 138000, Region: "East", Years: 7, Performance: "Excellent" },
  { Name: "Iris Garcia", Department: "Sales", Salary: 102000, Region: "South", Years: 5, Performance: "Good" },
  { Name: "Jack Zhang", Department: "Engineering", Salary: 162000, Region: "West", Years: 12, Performance: "Excellent" },
];

function loadData(data) {
  currentData = data;
  currentColumns = Object.keys(data[0] || {});

  columnTypes = {};
  currentColumns.forEach(col => {
    const sample = data[0][col];
    if (typeof sample === 'number') {
      columnTypes[col] = 'number';
    } else if (sample instanceof Date) {
      columnTypes[col] = 'date';
    } else {
      columnTypes[col] = 'text';
    }
  });

  renderUI();
  renderData(data.slice(0, 20));
  updateQuickQueries();
}

function renderUI() {
  document.getElementById('rowCount').textContent = currentData.length;
  document.getElementById('colCount').textContent = currentColumns.length;

  const columnsList = document.getElementById('columnsList');
  columnsList.innerHTML = currentColumns.map(col => `
    <div class="column-item" onclick="filterByColumn('${col}')">
      <span class="col-icon">${columnTypes[col] === 'number' ? '🔢' : '📝'}</span>
      <span>${col}</span>
      <span class="col-type">${columnTypes[col]}</span>
    </div>
  `).join('');

  document.getElementById('queryInput').disabled = false;
  document.getElementById('queryBtn').disabled = false;

  generateInsights();
}

function renderData(data) {
  const sheet = document.getElementById('spreadsheet');

  if (data.length === 0) {
    sheet.innerHTML = '<div class="empty-sheet">No data to display</div>';
    return;
  }

  const cols = currentColumns.slice(0, 6);
  let html = '<div class="sheet-header">';
  cols.forEach(col => {
    html += `<div class="sheet-cell" style="font-weight: 600;">${col}</div>`;
  });
  html += '</div>';

  data.forEach(row => {
    html += '<div class="sheet-row">';
    cols.forEach(col => {
      const val = row[col];
      const display = typeof val === 'number' ? val.toLocaleString() : val;
      html += `<div class="sheet-cell">${display}</div>`;
    });
    html += '</div>';
  });

  sheet.innerHTML = html;
}

function updateQuickQueries() {
  const numCols = currentColumns.filter(col => columnTypes[col] === 'number');
  const textCols = currentColumns.filter(col => columnTypes[col] === 'text');

  const queries = [
    `Show all ${currentData.length} records`,
    numCols.length > 0 ? `Top 10 by ${numCols[0]}` : '',
    textCols.length > 0 ? `Count by ${textCols[0]}` : '',
    numCols.length > 0 ? `Average ${numCols[0]}` : '',
    textCols.length > 1 ? `Group by ${textCols[1]}` : '',
  ].filter(Boolean);

  const quickArea = document.getElementById('quickQueries');
  quickArea.innerHTML = queries.map(q => `
    <button class="quick-btn" onclick="setQuery('${q}')">${q}</button>
  `).join('');
}

function generateInsights() {
  const numCols = currentColumns.filter(col => columnTypes[col] === 'number');
  let html = '';

  numCols.slice(0, 2).forEach(col => {
    const values = currentData.map(r => r[col]);
    const avg = (values.reduce((a, b) => a + b, 0) / values.length).toFixed(0);
    const max = Math.max(...values);

    const data = currentData.sort((a, b) => b[col] - a[col]).slice(0, 5);
    const maxHeight = Math.max(...data.map(d => d[col]));

    html += `
      <div class="insights-card">
        <div class="insight-label">${col}</div>
        <div class="insight-value">Avg: $${avg.toLocaleString()}</div>
        <div class="chart-mini">
          ${data.map(d => `<div class="bar-mini" style="height: ${(d[col]/maxHeight)*100}%"></div>`).join('')}
        </div>
      </div>
    `;
  });

  document.getElementById('insights').innerHTML = html;
}

function executeQuery() {
  const query = document.getElementById('queryInput').value.trim();
  if (!query || currentData.length === 0) return;

  document.getElementById('queryBtn').innerHTML = '<span class="loading"><div class="spinner"></div>Analyzing...</span>';
  document.getElementById('queryBtn').disabled = true;

  setTimeout(() => {
    processQuery(query);
    document.getElementById('queryBtn').innerHTML = 'Analyze';
    document.getElementById('queryBtn').disabled = false;
    document.getElementById('queryInput').value = '';
  }, 400);
}

function processQuery(query) {
  const q = query.toLowerCase();

  // Top N
  const topScore = semanticSimilarity(q, 'top');
  if (topScore > 0.5) {
    const numMatch = q.match(/(\d+)/);
    const n = numMatch ? parseInt(numMatch[1]) : 10;
    const numCol = currentColumns.find(col => columnTypes[col] === 'number');

    if (numCol) {
      const sorted = [...currentData].sort((a, b) => b[numCol] - a[numCol]).slice(0, n);
      renderData(sorted);
      return;
    }
  }

  // Count/Group
  const groupScore = semanticSimilarity(q, 'group');
  if (groupScore > 0.5) {
    const textCol = currentColumns.find(col => columnTypes[col] === 'text');
    if (textCol) {
      const grouped = {};
      currentData.forEach(row => {
        const key = row[textCol];
        grouped[key] = (grouped[key] || 0) + 1;
      });
      const grouped_data = Object.entries(grouped).sort((a, b) => b[1] - a[1]).map(([k, v]) => ({
        [textCol]: k,
        'Count': v
      }));
      renderData(grouped_data);
      return;
    }
  }

  // Average
  if (q.includes('average') || q.includes('avg')) {
    const numCol = currentColumns.find(col => columnTypes[col] === 'number');
    if (numCol) {
      const avg = (currentData.reduce((s, r) => s + r[numCol], 0) / currentData.length).toFixed(2);
      renderData([{ [numCol]: avg, 'Metric': 'Average' }]);
      return;
    }
  }

  // Show all
  renderData(currentData.slice(0, 50));
}

function setQuery(query) {
  document.getElementById('queryInput').value = query;
  executeQuery();
}

function filterByColumn(col) {
  setQuery(`Sort by ${col}`);
}

// File upload
document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (event) => {
    try {
      if (file.name.endsWith('.csv')) {
        const text = event.target.result;
        const rows = text.trim().split('\n');
        const headers = rows[0].split(',').map(h => h.trim());
        const data = rows.slice(1).map(row => {
          const values = row.split(',');
          const obj = {};
          headers.forEach((h, i) => {
            let val = values[i]?.trim() || '';
            obj[h] = isNaN(val) ? val : Number(val);
          });
          return obj;
        });
        loadData(data);
      } else if (file.name.endsWith('.json')) {
        const data = JSON.parse(event.target.result);
        loadData(Array.isArray(data) ? data : [data]);
      } else {
        loadData(sampleData);
      }
    } catch (err) {
      loadData(sampleData);
    }
  };
  reader.readAsText(file);
});

document.getElementById('queryInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') executeQuery();
});

// Initialize
loadData(sampleData);
</script>
